name: ESPHome build

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ESPHome
        run: python -m pip install --disable-pip-version-check esphome
      - name: Validate configuration
        env:
          COMPONENT_REF: ${{ github.head_ref || 'develop' }}
        run: esphome -s external_component_ref "$COMPONENT_REF" config RolloConfig.yaml
      - name: Compile firmware
        env:
          COMPONENT_REF: ${{ github.head_ref || 'develop' }}
        run: esphome -s external_component_ref "$COMPONENT_REF" compile RolloConfig.yaml

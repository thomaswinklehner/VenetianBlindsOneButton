binary_sensor:

  - platform: gpio
    name: '01_Küche'
    id: in_01

    pin:
      pcf8574: pcf_inputs_1to14
      number: 0
      mode:
        input: true
      inverted: true

    on_multi_click:

      - timing:
          - ON for at least 2s
          - ON for at most 5s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_01.all_press();

      - timing:
          - ON for at least 1s
          - ON for at most 1.99s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_01.stop_press();

      - timing:
          - ON for at most 0.99s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_01.short_press();

  # --- Cover 02 ---
  - platform: gpio
    name: '03_EZ_S D_Auf'
    id: in_03
    pin:
      pcf8574: pcf_inputs_1to14
      number: 2
      mode:
        input: true
      inverted: true
    on_multi_click:

      - timing:
          - ON for at least 2s
          - ON for at most 5s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_02.all_press();

      - timing:
          - ON for at least 1s
          - ON for at most 1.99s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_02.stop_press();

      - timing:
          - ON for at most 0.99s
          - OFF for at least 0.1s
        then:
          - lambda: |-
              button_02.short_press();


  - platform: gpio
    name: "29_Wind Alarm"
    id: wind_alarm
    pin:
      pcf8574: pcf_inputs_28to35_menu
      number: 0
      mode:
        input: true
      inverted: true   # NC contact -> OFF = alarm

    filters:
      - delayed_on: 2s   # ignore short glitches

    on_press:
      then:
        - logger.log: "WIND ALARM - Opening all covers"
        - cover.open: cover_01
        - cover.open: cover_02
        - cover.open: cover_03
        - cover.open: cover_04
        - cover.open: cover_05
        - cover.open: cover_06
        - cover.open: cover_07
        - cover.open: cover_08
        - cover.open: cover_09
        - cover.open: cover_10
        - cover.open: cover_11
        - cover.open: cover_12
        - cover.open: cover_13
        - cover.open: cover_14




substitutions:
  name: boneio-c-07
  friendly_name: 'BoneIO ESP Cover'
  serial_prefix: 'esp' #Don't change it.

esphome:
  name: '${name}'
  friendly_name: '${friendly_name}'
  name_add_mac_suffix: true  
  project:
    name: boneio.32x10-cover
    version: '0.7'
    
  on_boot:
    priority: 800
    then:
      - lambda: |-
          button_01.set_cover(id(cover_01));
          button_02.set_cover(id(cover_02));
          button_03.set_cover(id(cover_03));
          button_04.set_cover(id(cover_04));
          button_05.set_cover(id(cover_05));
          button_06.set_cover(id(cover_06));
          button_07.set_cover(id(cover_07));
          button_08.set_cover(id(cover_08));
          button_09.set_cover(id(cover_09));
          button_10.set_cover(id(cover_10));
          button_11.set_cover(id(cover_11));
          button_12.set_cover(id(cover_12));
          button_13.set_cover(id(cover_13));
          button_14.set_cover(id(cover_14));

          

esp32:
  board: nodemcu-32s
  framework:                                                                            
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/thomaswinklehner/VenetianBlindsOneButton
      ref: master
    components: [cover_button]

ethernet:
  id: eth
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16
  use_address: 192.168.0.127

dashboard_import:
  package_import_url: github://boneIO-eu/esphome/boneio-cover_v0_7.yaml@latest
  import_full_config: true

packages:
  internals_packages:
    url: https://github.com/boneIO-eu/esphome
    ref: v1.7.1
    files: [
        'devices/buzzer.yaml',
        'devices/serial_no.yaml',
        'devices_v0_7/display.yaml',
        'devices_v0_7/i2c.yaml',
        'devices_v0_7-v0_9/ina219.yaml',
        'devices_v0_7-v0_9/lm75b.yaml',
        'devices_v0_7-v0_9/pcf.yaml',
        'boards/cover/out01_02.yaml',
        'boards/cover/out03_04.yaml',
        'boards/cover/out05_06.yaml',
        'boards/cover/out07_08.yaml',
        'boards/cover/out09_10.yaml',
        'boards/cover/out11_12.yaml',
        'boards/cover/out13_14.yaml',
        'boards/cover/out15_16.yaml',
        'boards/cover/out17_18.yaml',
        'boards/cover/out19_20.yaml',
        'boards/cover/out21_22.yaml',
        'boards/cover/out23_24.yaml',
        'boards/cover/out25_26.yaml',
        'boards/cover/out27_28.yaml',
        'boards/cover/out29_30.yaml',
        'boards/cover/out31_32.yaml',
        # 'devices_v0_7-v0_9/one_wire.yaml',
      ]

logger:
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  local: true

time:
  - platform: homeassistant
    timezone: Europe/Warsaw
    id: homeassistant_time

